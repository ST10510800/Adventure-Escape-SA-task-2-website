<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fee Calculator - Adventure Escape SA</title>
</head>
<body>
    <header>
        <img src="../assets/images/logo.png" alt="Adventure Escape SA Logo" width="40">
        <strong>ADVENTURE ESCAPE SA</strong>
        <nav>
            <a href="../index.html">HOME</a> |
            <a href="about.html">ABOUT US</a> |
            <a href="activities.html">ACTIVITIES</a> |
            <a href="fees.html">FEE CALCULATOR</a> |
            <a href="contact.html">CONTACT US</a>
        </nav>
    </header>
    <p><small>Home &gt; Fee Calculator</small></p>
    <h1>Fee Calculator</h1>
    <form>
        <label for="activity">Select Activity:</label>
        <select id="activity" name="activity">
            <option value="">-- Select Activity --</option>
            <option value="ziplining">Ziplining Adventure (R750)</option>
            <option value="rock-climbing">Rock Climbing Session (R750)</option>
            <option value="ultimate">Ultimate Adventure Day (R1500)</option>
        </select>
        <br><br>
        <label>Number of participants:</label><br>
        <label for="adults">ADULTS:</label>
        <input type="number" id="adults" name="adults" min="0" value="0"><br>

        <label for="children">CHILDREN:</label>
        <input type="number" id="children" name="children" min="0" value="0">
        <br><br>

        <label for="date">Preferred Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="time">Time Slot:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label>Add ons:</label><br>
        <input type="checkbox" id="equipment" name="addons" value="250">
        <label for="equipment">Equipment Rental (R250)</label><br>

        <input type="checkbox" id="meal" name="addons" value="150">
        <label for="meal">Meal / Lunch Pack (R150)</label><br>

        <input type="checkbox" id="gopro" name="addons" value="800">
        <label for="gopro">GoPro Photo & Video Package (R800)</label>
        <br><br>
        <fieldset>
            <legend>Estimated Cost Breakdown</legend>
            <p>Activity (Adults x2): R3,000</p>
            <p>Activity (Children x1): R750</p>
            <p>Equipment Rental: R250</p>
            <hr>
            <strong>Total Estimated Fee: R4,000</strong>
        </fieldset>
        <br>
        <button type="submit">Submit Booking request</button>
        <button type="button">Save Quote</button>
    </form>
</body>
</html>
